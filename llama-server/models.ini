# Model presets for `llama-server`. Settings are mostly similar to those
# generated by the macOS application LlamaBarn.
#
# - ~/Library/Application Support/LlamaBarn/models.ini
# - https://github.com/ggml-org/llama.cpp/tree/master/tools/server
# - https://github.com/ggml-org/LlamaBarn

